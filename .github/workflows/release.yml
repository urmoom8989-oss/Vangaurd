name: Build Vangaurd (Mac, Windows)

# From Beta 1.3 the game is sold on Steam, so nothing is published on GitHub any more: no release, no
# standalone HTML. Each run builds the Mac and Windows apps and keeps them as private workflow artifacts
# (Actions → this run → Artifacts) to upload to Steam. The game, the server and the desktop app all use
# BUILD_NUMBER; server/latest.json holds the same number so the server knows the newest build.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'prebuilt/**'
      - 'public/assets/**'
      - 'desktop/**'
      - 'tools/build-release.mjs'
      - 'package.json'
      - '.github/workflows/release.yml'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: true

env:
  BUILD_LABEL: "Beta 1.3"
  FILE_LABEL: "Beta-1.3"
  # Fixed per version (Beta 1.21 was build 25). Keep in step with server/latest.json.
  BUILD_NUMBER: "26"
  # steamworks.js (Steam detection) is added at build time and shipped next to the app.
  STEAMWORKS_VERSION: "0.4.0"

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Add steamworks.js
        run: npm install --no-save --no-audit --no-fund "steamworks.js@${STEAMWORKS_VERSION}"
      - name: Prepare game files
        run: node tools/build-release.mjs --dist dist
      - name: Stamp the app version (1.30.<build>; installers need plain numbers, players see "Beta 1.3")
        run: npm pkg set version="1.30.${BUILD_NUMBER}"
      - name: Build Mac app (Apple Silicon + Intel)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg zip --arm64 --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          retention-days: 30
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Add steamworks.js
        shell: bash
        run: npm install --no-save --no-audit --no-fund "steamworks.js@${STEAMWORKS_VERSION}"
      - name: Prepare game files
        run: node tools/build-release.mjs --dist dist
      - name: Stamp the app version (1.30.<build>; installers need plain numbers, players see "Beta 1.3")
        shell: bash
        run: npm pkg set version="1.30.${BUILD_NUMBER}"
      - name: Build Windows app
        run: npx electron-builder --win nsis zip --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          retention-days: 30
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

  summary:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Write version.json (kept with the build; the server reads server/latest.json)
        run: |
          mkdir -p out
          cat > out/version.json <<JSON
          {
            "label": "${BUILD_LABEL}",
            "version": "1.30.${BUILD_NUMBER}",
            "build": ${BUILD_NUMBER},
            "commit": "${GITHUB_SHA::7}"
          }
          JSON
          cat out/version.json
      - uses: actions/upload-artifact@v4
        with:
          name: version
          retention-days: 30
          path: out/version.json
      - name: Summary
        run: |
          {
            echo "## Vangaurd ${BUILD_LABEL} (build ${BUILD_NUMBER})"
            echo ""
            echo "The Mac and Windows apps are in this run's **Artifacts** (private). Upload them to Steam."
            echo "Nothing was published on GitHub."
          } >> "$GITHUB_STEP_SUMMARY"
