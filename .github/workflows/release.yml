name: Build Vangaurd (Mac, Windows, standalone HTML)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'prebuilt/**'
      - 'public/assets/**'
      - 'desktop/**'
      - 'tools/build-release.mjs'
      - 'package.json'
      - '.github/workflows/release.yml'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

env:
  BUILD_LABEL: "Beta 1.2"
  FILE_LABEL: "Beta-1.2"
  RELEASE_TAG: "beta-1.2"
  # Every run gets a new build number. The game, the desktop apps and the server compare build numbers:
  # the desktop app offers to update, and the server only lets the newest build play online.
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the standalone HTML
        run: node tools/build-release.mjs --standalone "Vangaurd-${FILE_LABEL}.html"
      - uses: actions/upload-artifact@v4
        with:
          name: standalone
          path: Vangaurd-*.html
          if-no-files-found: error

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Prepare game files
        run: node tools/build-release.mjs --dist dist
      - name: Stamp the app version (1.20.<build>; installers need plain numbers, players see "Beta 1.2")
        run: npm pkg set version="1.20.${BUILD_NUMBER}"
      - name: Build Mac app (Apple Silicon + Intel)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg zip --arm64 --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Prepare game files
        run: node tools/build-release.mjs --dist dist
      - name: Stamp the app version (1.20.<build>; installers need plain numbers, players see "Beta 1.2")
        shell: bash
        run: npm pkg set version="1.20.${BUILD_NUMBER}"
      - name: Build Windows app
        run: npx electron-builder --win nsis zip --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

  release:
    needs: [standalone, mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      - name: Write version.json (read by the desktop updater and the multiplayer server)
        run: |
          cat > out/version.json <<JSON
          {
            "label": "${BUILD_LABEL}",
            "version": "1.20.${BUILD_NUMBER}",
            "build": ${BUILD_NUMBER},
            "tag": "${RELEASE_TAG}",
            "commit": "${GITHUB_SHA::7}",
            "files": {
              "win": "Vangaurd-${FILE_LABEL}-Setup.exe",
              "winZip": "Vangaurd-${FILE_LABEL}-win.zip",
              "macArm": "Vangaurd-${FILE_LABEL}-arm64.dmg",
              "macX64": "Vangaurd-${FILE_LABEL}-x64.dmg",
              "html": "Vangaurd-${FILE_LABEL}.html"
            }
          }
          JSON
          cat out/version.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true
          cat > notes.md <<NOTES
          Vangaurd ${BUILD_LABEL}.

          - **Windows**: \`Vangaurd-${FILE_LABEL}-Setup.exe\` installs the game; \`Vangaurd-${FILE_LABEL}-win.zip\` runs without installing. If SmartScreen appears, choose **More info → Run anyway**.
          - **Mac**: \`Vangaurd-${FILE_LABEL}-arm64.dmg\` for Apple Silicon (M1 and newer), \`Vangaurd-${FILE_LABEL}-x64.dmg\` for Intel Macs. The app is not notarized: the first time, right-click the app and choose **Open**. If macOS says it is damaged, run \`xattr -cr /Applications/Vangaurd.app\` in Terminal once.
          - **Browser**: \`Vangaurd-${FILE_LABEL}.html\` is the whole game in one file. Open it in Chrome or Edge.

          Online play requires this version. Games from Beta 0.92 on ask to update when they start and close if you do not; older ones need this download.
          NOTES
          gh release create "$RELEASE_TAG" out/* --target "$GITHUB_SHA" --latest --title "Vangaurd ${BUILD_LABEL}" --notes-file notes.md
