name: Build Vangaurd (Mac, Windows)

# Builds the Mac and Windows apps and publishes them as the GitHub release for this version, with a
# version.json that the desktop apps (auto-update) and the server (only the newest build plays online) read.
# The game, the server and the desktop app all use BUILD_NUMBER. (No standalone HTML is published.)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'prebuilt/**'
      - 'public/assets/**'
      - 'desktop/**'
      - 'tools/build-release.mjs'
      - 'package.json'
      - '.github/workflows/release.yml'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

env:
  BUILD_LABEL: "Beta 1.32"
  FILE_LABEL: "Beta-1.32"
  RELEASE_TAG: "beta-1.32"
  # Fixed per version (Beta 1.21 was build 25, Beta 1.3 was 26, Beta 1.31 was 27).
  BUILD_NUMBER: "28"
  # steamworks.js (Steam detection) is added at build time and shipped next to the app.
  STEAMWORKS_VERSION: "0.4.0"

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Add steamworks.js
        run: npm install --no-save --no-audit --no-fund "steamworks.js@${STEAMWORKS_VERSION}"
      - name: Prepare game files
        run: node tools/build-release.mjs --dist dist
      - name: Stamp the app version (1.32.<build>; installers need plain numbers, players see "Beta 1.32")
        run: npm pkg set version="1.32.${BUILD_NUMBER}"
      - name: Build Mac app (Apple Silicon + Intel)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg zip --arm64 --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          retention-days: 30
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Add steamworks.js
        shell: bash
        run: npm install --no-save --no-audit --no-fund "steamworks.js@${STEAMWORKS_VERSION}"
      - name: Prepare game files
        run: node tools/build-release.mjs --dist dist
      - name: Stamp the app version (1.32.<build>; installers need plain numbers, players see "Beta 1.32")
        shell: bash
        run: npm pkg set version="1.32.${BUILD_NUMBER}"
      - name: Build Windows app
        run: npx electron-builder --win nsis zip --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          retention-days: 30
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

  release:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mac
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: out
      - run: ls -la out
      - name: Write version.json (read by the desktop updater and the multiplayer server)
        run: |
          cat > out/version.json <<JSON
          {
            "label": "${BUILD_LABEL}",
            "version": "1.32.${BUILD_NUMBER}",
            "build": ${BUILD_NUMBER},
            "tag": "${RELEASE_TAG}",
            "commit": "${GITHUB_SHA::7}",
            "files": {
              "win": "Vangaurd-${FILE_LABEL}-Setup.exe",
              "winZip": "Vangaurd-${FILE_LABEL}-win.zip",
              "macArm": "Vangaurd-${FILE_LABEL}-arm64.dmg",
              "macX64": "Vangaurd-${FILE_LABEL}-x64.dmg"
            }
          }
          JSON
          cat out/version.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true
          cat > notes.md <<NOTES
          Vangaurd ${BUILD_LABEL}.

          - **Windows**: \`Vangaurd-${FILE_LABEL}-Setup.exe\` installs the game; \`Vangaurd-${FILE_LABEL}-win.zip\` runs without installing. If SmartScreen appears, choose **More info → Run anyway**.
          - **Mac**: \`Vangaurd-${FILE_LABEL}-arm64.dmg\` for Apple Silicon (M1 and newer), \`Vangaurd-${FILE_LABEL}-x64.dmg\` for Intel Macs. The app is not notarized: the first time, right-click the app and choose **Open**. If macOS says it is damaged, run \`xattr -cr /Applications/Vangaurd.app\` in Terminal once.

          What's new:
          - Small fixes and improvements.

          Online play requires this version. Installed games ask to update when they start.
          NOTES
          gh release create "$RELEASE_TAG" out/* --target "$GITHUB_SHA" --latest --title "Vangaurd ${BUILD_LABEL}" --notes-file notes.md

  summary:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Write version.json (kept with the build; the server reads server/latest.json)
        run: |
          mkdir -p out
          cat > out/version.json <<JSON
          {
            "label": "${BUILD_LABEL}",
            "version": "1.32.${BUILD_NUMBER}",
            "build": ${BUILD_NUMBER},
            "commit": "${GITHUB_SHA::7}"
          }
          JSON
          cat out/version.json
      - uses: actions/upload-artifact@v4
        with:
          name: version
          retention-days: 30
          path: out/version.json
      - name: Summary
        run: |
          {
            echo "## Vangaurd ${BUILD_LABEL} (build ${BUILD_NUMBER})"
            echo ""
            echo "Published as the GitHub release ${RELEASE_TAG} (Mac and Windows apps + version.json)."
            echo "The apps are also in this run's Artifacts for 30 days (e.g. to upload to Steam)."
          } >> "$GITHUB_STEP_SUMMARY"
