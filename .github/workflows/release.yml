name: Build Vangaurd (Mac, Windows)

# Builds the Mac and Windows apps and publishes them as the GitHub release for this version, with a
# version.json that the desktop apps (auto-update) and the server (only the newest build plays online) read.
# The game, the server and the desktop app all use BUILD_NUMBER. (No standalone HTML is published.)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'prebuilt/**'
      - 'public/assets/**'
      - 'desktop/**'
      - 'tools/build-release.mjs'
      - 'package.json'
      - '.github/workflows/release.yml'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

env:
  BUILD_LABEL: "Release 1.0"
  FILE_LABEL: "Release-1.0"
  RELEASE_TAG: "release-1.0"
  # Fixed per version (Beta 1.21 was build 25, Beta 1.3 was 26, Beta 1.31 was 27, Beta 1.32 was 28).
  BUILD_NUMBER: "29"
  # Installers need plain numbers: Release 1.0 build 29 is app version 2.0.29.
  APP_VERSION: "2.0"
  # "true" publishes a GitHub pre-release: it is not the latest release, so installed games are not asked to
  # update, the server keeps the previous build as the newest, and only the owner can play this build online.
  # Set it to "false" (or mark the release as latest on GitHub) to release this version to everyone.
  PRERELEASE: "true"
  # steamworks.js (Steam detection) is added at build time and shipped next to the app.
  STEAMWORKS_VERSION: "0.4.0"

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Add steamworks.js
        run: npm install --no-save --no-audit --no-fund "steamworks.js@${STEAMWORKS_VERSION}"
      - name: Prepare game files
        run: node tools/build-release.mjs --dist dist
      - name: Stamp the app version (<APP_VERSION>.<build>; installers need plain numbers, players see BUILD_LABEL)
        run: npm pkg set version="${APP_VERSION}.${BUILD_NUMBER}"
      - name: Build Mac app (Apple Silicon + Intel)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg zip --arm64 --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          retention-days: 30
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Add steamworks.js
        shell: bash
        run: npm install --no-save --no-audit --no-fund "steamworks.js@${STEAMWORKS_VERSION}"
      - name: Prepare game files
        run: node tools/build-release.mjs --dist dist
      - name: Stamp the app version (<APP_VERSION>.<build>; installers need plain numbers, players see BUILD_LABEL)
        shell: bash
        run: npm pkg set version="${APP_VERSION}.${BUILD_NUMBER}"
      - name: Build Windows app
        run: npx electron-builder --win nsis zip --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          retention-days: 30
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

  release:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mac
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: out
      - run: ls -la out
      - name: Write version.json (read by the desktop updater and the multiplayer server)
        run: |
          cat > out/version.json <<JSON
          {
            "label": "${BUILD_LABEL}",
            "version": "${APP_VERSION}.${BUILD_NUMBER}",
            "build": ${BUILD_NUMBER},
            "tag": "${RELEASE_TAG}",
            "commit": "${GITHUB_SHA::7}",
            "files": {
              "win": "Vangaurd-${FILE_LABEL}-Setup.exe",
              "winZip": "Vangaurd-${FILE_LABEL}-win.zip",
              "macArm": "Vangaurd-${FILE_LABEL}-arm64.dmg",
              "macX64": "Vangaurd-${FILE_LABEL}-x64.dmg"
            }
          }
          JSON
          cat out/version.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true
          if [ "$PRERELEASE" = "true" ]; then
            INTRO="Vangaurd ${BUILD_LABEL} (preview). This version is not released yet: only the owner can play it online. Everyone else keeps the current version."
            FLAG="--prerelease --latest=false"
          else
            INTRO="Vangaurd ${BUILD_LABEL}."
            FLAG="--latest"
          fi
          cat > notes.md <<NOTES
          ${INTRO}

          - **Windows**: \`Vangaurd-${FILE_LABEL}-Setup.exe\` installs the game; \`Vangaurd-${FILE_LABEL}-win.zip\` runs without installing. If SmartScreen appears, choose **More info → Run anyway**.
          - **Mac**: \`Vangaurd-${FILE_LABEL}-arm64.dmg\` for Apple Silicon (M1 and newer), \`Vangaurd-${FILE_LABEL}-x64.dmg\` for Intel Macs. The app is not notarized: the first time, right-click the app and choose **Open**. If macOS says it is damaged, run \`xattr -cr /Applications/Vangaurd.app\` in Terminal once.

          What's new:
          - The Halloween Pack DLC (\$2.99 on Steam): the Skeleton and Pumpkin Head operators (you see their arms in first person too) and the animated Halloween camo.
          - An Operators screen on the main menu.
          - A weekly game mode online next to Team Deathmatch (Kill Confirmed this week, then Gun Game, changing every Monday).
          - North American and European servers (Settings > Account).
          - Enemies only show on the minimap while your team has a UAV up.
          - Halloween on every map until 10 November: pumpkin patches, graveyards, cauldrons, scarecrows, hay bales, candles and bats under a purple, foggy sky.
          - A new level-up sound, easier daily challenges, and Drone mode on a controller.
          - Blackout: Team Deathmatch on a pitch-dark map where only jack-o'-lanterns and cauldrons give light (singleplayer, and online in the weekly rotation).
          - New Loadouts screen: loadout cards, a weapon page, the Gunsmith with a 3D view of your gun, and Cosmetics.
          - Gun charms and stickers to show off on your guns.
          - Inspect your gun with I (fire mode moved to B).
          - The killcam shows your killer's bullets and hitmarkers.
          - Controller buttons can be changed, with Xbox, PlayStation and Switch layouts (Settings > Keybinds).
          - Your ping to North America and Europe in Settings > Account.
          - The Season Pass page (Season 1, a free track of 100 levels; it opens later).
          - Stronger anti-cheat: the server checks the distance and line of sight of every hit, and moderators can watch a replay of a reported player.

          Online play requires this version once it is released. Installed games ask to update when they start.
          NOTES
          gh release create "$RELEASE_TAG" out/* --target "$GITHUB_SHA" $FLAG --title "Vangaurd ${BUILD_LABEL}" --notes-file notes.md

  summary:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Write version.json (kept with the build; the server reads server/latest.json)
        run: |
          mkdir -p out
          cat > out/version.json <<JSON
          {
            "label": "${BUILD_LABEL}",
            "version": "${APP_VERSION}.${BUILD_NUMBER}",
            "build": ${BUILD_NUMBER},
            "commit": "${GITHUB_SHA::7}"
          }
          JSON
          cat out/version.json
      - uses: actions/upload-artifact@v4
        with:
          name: version
          retention-days: 30
          path: out/version.json
      - name: Summary
        run: |
          {
            echo "## Vangaurd ${BUILD_LABEL} (build ${BUILD_NUMBER})"
            echo ""
            if [ "$PRERELEASE" = "true" ]; then echo "Published as the GitHub pre-release ${RELEASE_TAG} (not the latest release: only the owner can play it online)."; else echo "Published as the GitHub release ${RELEASE_TAG} (Mac and Windows apps + version.json)."; fi
            echo "The apps are also in this run's Artifacts for 30 days (e.g. to upload to Steam)."
          } >> "$GITHUB_STEP_SUMMARY"
