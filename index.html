<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vangaurd</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; -webkit-user-select: none; user-select: none; }
      #app { position: fixed; inset: 0; }
      #app > canvas { display: block; width: 100%; height: 100%; outline: none; }
      #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
      #ui { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
      #boot-overlay { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 12px; background: rgba(0,0,0,0.55); cursor: pointer; letter-spacing: 0.08em; }
      #boot-overlay.hidden { display: none; }
      #boot-overlay h1 { margin: 0; font-size: 42px; font-weight: 800; text-transform: uppercase; }
      #boot-overlay p { margin: 0; opacity: 0.75; font-size: 14px; text-transform: uppercase; }
      #core-diag { position: fixed; left: 8px; bottom: 8px; z-index: 40; font: 12px/1.35 ui-monospace, Consolas, monospace;
        color: #ffb4b4; background: rgba(40,0,0,0.75); padding: 6px 8px; border-radius: 4px; max-width: 50vw; white-space: pre-wrap; display: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="ui"></div>
    <div id="boot-overlay" class="hidden"><h1>Vangaurd</h1><p>Click to deploy</p></div>
    <div id="core-diag"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
